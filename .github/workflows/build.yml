name: Build Shohoj Hisab Android APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:

      # Step 1: Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4


      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      # Step 3: Setup Java JDK 21
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'


      # Step 4: Install Project Dependencies
      - name: Install Dependencies
        run: |
          npm install --force


      # Step 5: Build Web Application
      - name: Build Web Application
        run: |
          npm run build -- --base=./ || npm run build

          if [ ! -d "dist" ]; then
            echo "dist folder not found. Creating dist folder..."

            mkdir -p dist

            if [ -f "index.html" ]; then
              cp index.html dist/
            fi
          fi


      # Step 6: Install Capacitor
      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android


      # Step 7: Configure Capacitor
      - name: Configure Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.shohojhisab.app",
            "appName": "Shohoj Hisab",
            "webDir": "dist",
            "server": {
              "androidScheme": "https",
              "hostname": "localhost",
              "cleartext": true
            }
          }
          EOF


      # Step 8: Add Android Platform
      - name: Add Android Platform
        run: |
          npx cap add android || true


      # Step 9: Sync Capacitor
      - name: Sync Capacitor Android Project
        run: |
          npx cap sync android


      # Step 10: Build Android APK
      - name: Build Android Debug APK
        run: |
          cd android

          chmod +x gradlew

          ./gradlew assembleDebug


      # Step 11: Upload APK
      - name: Upload Shohoj Hisab APK
        uses: actions/upload-artifact@v4
        with:
          name: Shohoj-Hisab-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
