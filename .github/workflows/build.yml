name: Build Shohoj Hisab Android APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # Step 1: Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4


      # Step 2: Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'


      # Step 3: Set up Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3


      # Step 4: Make Gradle executable
      - name: Grant Gradle Execute Permission
        run: chmod +x gradlew


      # Step 5: Build Debug APK
      - name: Build Shohoj Hisab APK
        run: ./gradlew assembleDebug


      # Step 6: Upload APK
      - name: Upload Shohoj Hisab APK
        uses: actions/upload-artifact@v4
        with:
          name: Shohoj-Hisab-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error            "appName": "Shohoj Hisab",
            "webDir": "dist",
            "server": {
              "androidScheme": "https",
              "hostname": "localhost",
              "cleartext": true
            }
          }
          EOF


      # Step 8: Add Android Platform
      - name: Add Android Platform
        run: |
          npx cap add android || true


      # Step 9: Sync Capacitor
      - name: Sync Capacitor Android Project
        run: |
          npx cap sync android


      # Step 10: Build Android APK
      - name: Build Android Debug APK
        run: |
          cd android

          chmod +x gradlew

          ./gradlew assembleDebug


      # Step 11: Upload APK
      - name: Upload Shohoj Hisab APK
        uses: actions/upload-artifact@v4
        with:
          name: Shohoj-Hisab-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
