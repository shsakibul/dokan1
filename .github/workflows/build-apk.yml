name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK Filename
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Shohoj-Hisab.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shohoj-Hisab-APK
          path: app/build/outputs/apk/debug/Shohoj-Hisab.apk

      - name: Publish Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Shohoj Hisab Latest Release
          draft: false
          prerelease: false
          files: app/build/outputs/apk/debug/Shohoj-Hisab.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
